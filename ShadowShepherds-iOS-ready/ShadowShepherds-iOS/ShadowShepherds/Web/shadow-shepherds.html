  ctx.fillRect(-7, 14, 1, 2); ctx.fillRect(-5, 14, 1, 2);
  ctx.fillRect(4, 14, 1, 2); ctx.fillRect(6, 14, 1, 2);
  // arms with claws
  ctx.fillStyle = '#1a0814';
  ctx.fillRect(-10, 0, 4, 8);
  ctx.fillRect(8, 0, 4, 8);
  ctx.fillStyle = '#aaa';
  ctx.fillRect(-10, 8, 1, 2); ctx.fillRect(-7, 8, 1, 2);
  ctx.fillRect(11, 8, 1, 2); ctx.fillRect(8, 8, 1, 2);
  // head (slightly oversized)
  ctx.fillStyle = '#1a0814';
  ctx.beginPath(); ctx.ellipse(2, -6, 9, 7, 0, 0, Math.PI*2); ctx.fill();
  // horns
  ctx.fillStyle = '#3a1a30';
  ctx.beginPath(); ctx.moveTo(-3, -10); ctx.lineTo(-1, -16); ctx.lineTo(1, -10); ctx.fill();
  ctx.beginPath(); ctx.moveTo(3, -10); ctx.lineTo(5, -16); ctx.lineTo(7, -10); ctx.fill();
  // glowing eyes
  const eyePulse = 1 + Math.sin(e.glow || 0) * 0.2;
  ctx.fillStyle = '#ff44aa';
  ctx.beginPath(); ctx.arc(-1, -6, 1.6 * eyePulse, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5, -6, 1.6 * eyePulse, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-0.5, -6, 0.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5.5, -6, 0.6, 0, Math.PI*2); ctx.fill();
  // pointed teeth
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(-2, -1); ctx.lineTo(0, 2); ctx.lineTo(2, -1);
  ctx.moveTo(2, -1); ctx.lineTo(4, 2); ctx.lineTo(6, -1);
  ctx.fill();
  // wisp tail
  ctx.fillStyle = 'rgba(150,80,200,0.4)';
  ctx.beginPath(); ctx.ellipse(-12, 4, 6, 3, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ---------- Boss draw ---------- */
function drawBoss() {
  if (!boss) return;
  if (boss.hp <= 0 && boss.glow > 4) return;
  if (boss.type === 'wolf') drawWolfBoss();
  else if (boss.type === 'vacuum') drawVacuumBoss();
  else if (boss.type === 'mailman') drawMailmanBoss();
}
function drawWolfBoss() {
  if (boss.variant === 'ratking') { drawRatKingBoss(); return; }
  if (boss.variant === 'yeti') { drawYetiBoss(); return; }
  if (boss.variant === 'shadow') { drawShadowBoss(); return; }
  const isAlpha = boss.variant === 'alpha';
  const isPack = boss.variant === 'pack';
  const palette = isAlpha ? {
    body0: '#a06030', body1: '#5a3010',
    saddle: '#3a1a06', limb: '#5a3010',
    head: '#7a4a22', snout: '#3a1a06',
    auraInner: 'rgba(180,80,30,0.6)', auraOuter: 'rgba(180,80,30,0)',
    collar: '#114488', collarStud: '#ffcc33',
    eye: boss.state==='charge' ? '#ffcc33' : '#ffffff',
    bodyShadowColor: '#3a1a06',
  } : isPack ? {
    body0: '#a8a8a8', body1: '#666',
    saddle: '#3a3a3a', limb: '#666',
    head: '#888', snout: '#444',
    auraInner: 'rgba(160,180,200,0.45)', auraOuter: 'rgba(160,180,200,0)',
    collar: '#3a2a1a', collarStud: '#aa6644',
    eye: boss.state==='charge' ? '#ffee44' : '#ffeebb',
    bodyShadowColor: '#3a3a3a',
  } : {
    body0: '#2a1a30', body1: '#0a0510',
    saddle: '#000000', limb: '#1a0a1c',
    head: '#1a0a1c', snout: '#0a0510',
    auraInner: 'rgba(80,0,40,0.6)', auraOuter: 'rgba(80,0,40,0)',
    collar: '#440011', collarStud: '#dddddd',
    eye: boss.state==='charge' ? '#ff3300' : '#ff8833',
    bodyShadowColor: '#000000',
  };
  const sx = boss.x - cam.x, sy = boss.y - cam.y;
  ctx.save();
  if (boss.invuln > 0 && Math.floor(boss.invuln/3)%2===0) ctx.globalAlpha = 0.5;
  const aura = ctx.createRadialGradient(sx+boss.w/2, sy+boss.h/2, 10, sx+boss.w/2, sy+boss.h/2, 90);
  aura.addColorStop(0, palette.auraInner); aura.addColorStop(1, palette.auraOuter);
  ctx.fillStyle = aura; ctx.fillRect(sx-30,sy-30,boss.w+60,boss.h+60);
  ctx.translate(sx + boss.w/2, sy + boss.h/2);
  ctx.scale(boss.facing, 1);
  const grad = ctx.createLinearGradient(0,-30,0,40);
  grad.addColorStop(0, palette.body0); grad.addColorStop(1, palette.body1);
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.ellipse(0,8,52,28,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = palette.bodyShadowColor;
  ctx.beginPath(); ctx.ellipse(-6,-2,42,16,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = palette.limb;
  ctx.fillRect(-30,30,10,18); ctx.fillRect(-12,32,10,16);
  ctx.fillRect(10,32,10,16); ctx.fillRect(28,30,10,18);
  ctx.strokeStyle = palette.limb; ctx.lineWidth=10; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-46,4); ctx.quadraticCurveTo(-72,-10+Math.sin(elapsed*0.1)*4,-66,-26); ctx.stroke();
  ctx.fillStyle = palette.head;
  ctx.beginPath(); ctx.ellipse(38,-8,22,18,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = palette.snout;
  ctx.beginPath(); ctx.ellipse(54,-2,12,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  for (let i=0;i<4;i++) {
    ctx.beginPath();

  }

  ctx.beginPath(); ctx.arc(40,-12,4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(50,-12,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.arc(41,-13,1.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(51,-13,1.4,0,Math.PI*2); ctx.fill();
  // ears
  ctx.fillStyle = palette.head;
  ctx.beginPath(); ctx.moveTo(28,-22); ctx.lineTo(34,-38); ctx.lineTo(40,-20); ctx.fill();
  ctx.beginPath(); ctx.moveTo(46,-22); ctx.lineTo(52,-38); ctx.lineTo(56,-20); ctx.fill();
  // ear interior (only on alpha or pack variant)

    ctx.beginPath(); ctx.ellipse(-10, -8, 20, 4, 0, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#444';
  ctx.fillRect(28, 4, 32, 5);
  ctx.fillStyle = '#888';

  // dangling chain link

  ctx.beginPath();

function drawCrusherBoss() {
  const sx = boss.x - cam.x, sy = boss.y - cam.y;
  ctx.save();
  if (boss.invuln > 0 && Math.floor(boss.invuln/3)%2===0) ctx.globalAlpha = 0.55;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(sx + boss.w/2, sy + boss.h - 4, boss.w/2 - 6, 6, 0, 0, Math.PI*2); ctx.fill();

  // magnet attractor visual when sucking
  if (boss.state === 'suck') {
    const cx = sx + boss.w/2, cy = sy + boss.h*0.5;
    ctx.strokeStyle = 'rgba(80,140,200,0.55)';
    ctx.lineWidth = 1;
    for (let i=0;i<24;i++) {
      const a = (elapsed*0.1 + i*0.4) % (Math.PI*2);
      const r1 = 60 + ((elapsed*2+i*30)%240);
      const r2 = r1 - 30;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a)*r1, cy + Math.sin(a)*r1);
      ctx.lineTo(cx + Math.cos(a)*r2, cy + Math.sin(a)*r2);
      ctx.stroke();
    }
  }

  ctx.translate(sx + boss.w/2, sy + boss.h/2);
  ctx.scale(boss.facing, 1);
  const halfW = boss.w/2, halfH = boss.h/2;

  // === TREADS (tank-style base) ===
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-halfW + 8, halfH - 22, boss.w - 16, 22);
  // tread links rolling
  const tRoll = elapsed * 0.3 * (boss.vx > 0 ? 1 : -1);
  ctx.fillStyle = '#2a2a2a';
  for (let i = 0; i < 12; i++) {
    const tx = -halfW + 12 + ((i*9 + tRoll*4) % (boss.w - 24));
    ctx.fillRect(tx, halfH - 18, 6, 18);
  }
  // tread wheels
  ctx.fillStyle = '#444';
  for (const wx of [-halfW + 16, -8, halfW - 24]) {
    ctx.beginPath(); ctx.arc(wx, halfH - 10, 8, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = '#666';
  for (const wx of [-halfW + 16, -8, halfW - 24]) {
    ctx.save();
    ctx.translate(wx, halfH - 10);
    ctx.rotate(tRoll * 0.5);
    ctx.fillRect(-1,-5,2,10); ctx.fillRect(-5,-1,10,2);
    ctx.restore();
  }

  // === MAIN BODY (yellow/black industrial chassis) ===
  ctx.fillStyle = '#cc9933';
  ctx.fillRect(-halfW + 4, -halfH + 18, boss.w - 8, halfH - 4);
  // caution stripes
  ctx.fillStyle = '#1a1a1a';
  for (let i = -halfW + 8; i < halfW - 12; i += 14) {
    ctx.beginPath();
    ctx.moveTo(i, -halfH + 18); ctx.lineTo(i + 8, -halfH + 18);
    ctx.lineTo(i + 14, halfH - 4); ctx.lineTo(i + 6, halfH - 4);
    ctx.closePath(); ctx.fill();
  }
  // panel border
  ctx.strokeStyle = '#5a3a0a'; ctx.lineWidth = 2;
  ctx.strokeRect(-halfW + 4, -halfH + 18, boss.w - 8, halfH - 4);

  // bolts
  ctx.fillStyle = '#666';
  for (const bp of [[-halfW+10,-halfH+24],[halfW-14,-halfH+24],[-halfW+10,halfH-10],[halfW-14,halfH-10]]) {
    ctx.beginPath(); ctx.arc(bp[0], bp[1], 2.5, 0, Math.PI*2); ctx.fill();
  }

  // CRUSHER PLATE on top (raises in idle, slams during attacks)
  const plateY = (boss.state === 'spit' || boss.state === 'suck') ? -halfH - 20 : -halfH - 6;
  ctx.fillStyle = '#888';
  ctx.fillRect(-halfW + 8, plateY, boss.w - 16, 12);
  ctx.fillStyle = '#444';
  // teeth on bottom of crusher plate
  for (let i = -halfW + 12; i < halfW - 12; i += 10) {
    ctx.beginPath();
    ctx.moveTo(i, plateY + 12); ctx.lineTo(i + 4, plateY + 18); ctx.lineTo(i + 8, plateY + 12);
    ctx.fill();
  }
  // hydraulic pistons
  ctx.fillStyle = '#aaa';
  ctx.fillRect(-halfW + 14, plateY + 12, 4, -halfH + 18 - plateY - 12);
  ctx.fillRect(halfW - 18, plateY + 12, 4, -halfH + 18 - plateY - 12);
  ctx.fillStyle = '#666';
  ctx.fillRect(-halfW + 13, plateY + 14, 6, 3);
  ctx.fillRect(halfW - 19, plateY + 14, 6, 3);

  // === MAGNET HANGING FROM CRANE ARM (front) ===
  // crane arm
  ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(halfW - 20, -halfH + 22);
  ctx.lineTo(halfW + 6, -halfH);
  ctx.lineTo(halfW + 22, -halfH);
  ctx.stroke();
  // chain
  const magSwing = Math.sin(elapsed * 0.05) * 8;
  ctx.strokeStyle = '#666'; ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    const cy = -halfH + 4 + i*5;
    ctx.beginPath();
    ctx.arc(halfW + 22 + magSwing*(i/6), cy, 2, 0, Math.PI*2);
    ctx.stroke();
  }
  // magnet (red horseshoe)
  const magX = halfW + 22 + magSwing;
  const magY = -halfH + 36;
  ctx.fillStyle = '#cc1a1a';
  ctx.fillRect(magX - 12, magY, 24, 14);
  ctx.fillRect(magX - 12, magY, 6, 22);
  ctx.fillRect(magX + 6, magY, 6, 22);
  // magnet ends (silver poles)
  ctx.fillStyle = '#aaa';
  ctx.fillRect(magX - 12, magY + 18, 6, 4);
  ctx.fillRect(magX + 6, magY + 18, 6, 4);
  // N/S labels
  ctx.fillStyle = '#fff';
  ctx.font='bold 6px Trebuchet MS';
  ctx.textAlign='center';
  ctx.fillText('N', magX - 9, magY + 8);
  ctx.fillText('S', magX + 9, magY + 8);
  ctx.textAlign='left';

  // EYES (headlights) — turn red when angry
  const eyeColor = boss.state === 'roll' ? '#ff3030' : (boss.state === 'suck' ? '#ffcc33' : '#ffaa55');
  for (const ex of [-halfW + 24, halfW - 36]) {
    const glow = ctx.createRadialGradient(ex, -halfH + 32, 2, ex, -halfH + 32, 14);
    glow.addColorStop(0, eyeColor);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(ex - 14, -halfH + 22, 28, 24);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex, -halfH + 32, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(ex+1, -halfH + 32, 1.6, 0, Math.PI*2); ctx.fill();
  }

  // grille mouth
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-halfW + 30, halfH - 8, boss.w - 60, 4);
  ctx.fillStyle = '#666';
  for (let i=0;i<8;i++) ctx.fillRect(-halfW + 32 + i*7, halfH - 8, 1, 4);

  // brand label
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-30, -8, 60, 10);
  ctx.fillStyle = '#ffcc33';
  ctx.font='bold 8px Trebuchet MS';
  ctx.textAlign='center';
  ctx.fillText('CRUSH-O-MATIC', 0, 0);
  ctx.textAlign='left';

  // smoke stack with puffs
  ctx.fillStyle = '#444';
  ctx.fillRect(-halfW + 18, -halfH + 4, 8, 16);
  ctx.fillRect(-halfW + 16, -halfH + 2, 12, 4);
  ctx.fillStyle = `rgba(120,120,120,${0.4 + Math.sin(elapsed*0.2)*0.3})`;
  for (let i = 0; i < 3; i++) {
    const py = -halfH - 6 - i*8 + Math.sin(elapsed*0.15 + i)*2;
    const pr = 4 + i*2;
    ctx.beginPath(); ctx.arc(-halfW + 22 + Math.sin(elapsed*0.1 + i)*3, py, pr, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore();
  drawBossHPBar(boss.name || 'THE CRUSHER');
}

function drawGarbageTruckBoss() {
  const sx = boss.x - cam.x, sy = boss.y - cam.y;

  if (boss.invuln > 0 && Math.floor(boss.invuln/3)%2===0) ctx.globalAlpha = 0.55;

  // suction visual (intake at the back compactor)

    const cx = sx + (boss.facing < 0 ? boss.w - 20 : 20);
    const cy = sy + boss.h*0.45;
    ctx.strokeStyle='rgba(120,100,60,0.5)';

    for (let i=0;i<24;i++) {
      const a = (elapsed*0.1 + i*0.4) % (Math.PI*2);
      const r1 = 60 + ((elapsed*2+i*30)%240);
      const r2 = r1 - 30;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a)*r1, cy + Math.sin(a)*r1);
      ctx.lineTo(cx + Math.cos(a)*r2, cy + Math.sin(a)*r2);

  const halfW = boss.w/2, halfH = boss.h/2;

  }

  ctx.moveTo(halfW - 36, -halfH+22);
  ctx.lineTo(halfW - 36, -halfH+8);
  ctx.lineTo(halfW - 4, -halfH+8);
  ctx.lineTo(halfW - 4, -halfH+22);

  // window pillar

  // headlight (eye - lights up red when angry/charging)

  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(halfW - 7, halfH - 14, 1.6, 0, Math.PI*2); ctx.fill();
  // grille mouth (angry teeth)
  ctx.fillStyle = '#222';
  ctx.fillRect(halfW - 36, halfH - 10, 36, 6);
  ctx.fillStyle = '#aaa';
  for (let i=0;i<6;i++) ctx.fillRect(halfW - 34 + i*6, halfH - 10, 1, 6);
  // bumper
  ctx.fillStyle = '#aaa';
  ctx.fillRect(halfW - 36, halfH - 2, 36, 4);

  // brand label on side

  drawBossHPBar(boss.name || 'GARBAGE TRUCK');

function drawMailmanBoss() {
  const sx = boss.x - cam.x, sy = boss.y - cam.y;
  ctx.save();
  if (boss.invuln > 0 && Math.floor(boss.invuln/3)%2===0) ctx.globalAlpha = 0.55;

  // shadow at feet
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(sx + boss.w/2, sy + boss.h - 4, 32, 6, 0, 0, Math.PI*2); ctx.fill();

  ctx.translate(sx + boss.w/2, sy + boss.h/2);
  ctx.scale(boss.facing, 1);

  // legs (postal slacks - blue)
  const isJumping = boss.state === 'packageSlam' && boss.slamPhase >= 1;
  ctx.fillStyle = '#2a3a6a';
  ctx.fillRect(-12, 18, 8, 24);
  ctx.fillRect(4, 18, 8, 24);
  // shoes
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-14, 40, 12, 4);
  ctx.fillRect(2, 40, 12, 4);

  // body (postal blue uniform)
  const bodyGrad = ctx.createLinearGradient(0,-10,0,20);
  bodyGrad.addColorStop(0,'#3a5aaa'); bodyGrad.addColorStop(1,'#1a2a55');
  ctx.fillStyle = bodyGrad;
  ctx.fillRect(-18, -8, 36, 30);
  // shirt collar
  ctx.fillStyle = '#5a7adc';
  ctx.beginPath();
  ctx.moveTo(-8, -8); ctx.lineTo(0, 0); ctx.lineTo(8, -8); ctx.closePath();
  ctx.fill();
  // shirt buttons
  ctx.fillStyle = '#ffcc33';
  for (let i=0;i<3;i++) {
    ctx.beginPath(); ctx.arc(0, 4 + i*5, 1.2, 0, Math.PI*2); ctx.fill();
  }
  // belt
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-18, 18, 36, 4);
  ctx.fillStyle = '#ccc';
  ctx.fillRect(-2, 18, 4, 4);

  // mail bag slung across body
  ctx.fillStyle = '#7a5a2a';
  ctx.beginPath();
  ctx.ellipse(-22, 8, 12, 14, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(-24, 4, 4, 14);
  // strap diagonal
  ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-22, -4); ctx.lineTo(12, -10); ctx.stroke();
  // letters poking out of bag
  ctx.fillStyle = '#fff';
  ctx.fillRect(-24, -2, 8, 4);
  ctx.fillRect(-22, -6, 6, 4);

  // arms
  ctx.fillStyle = '#3a5aaa';
  // back arm
  ctx.fillRect(-22, -2, 8, 14);
  // front arm — pose changes by state
  ctx.save();
  if (boss.state === 'letterThrow') {
    // thrown forward
    ctx.fillRect(8, -4, 18, 8);
    // letter held
    ctx.fillStyle = '#fff';
    ctx.fillRect(22, -6, 8, 6);
  } else if (boss.state === 'packageSlam' && boss.slamPhase === 0) {
    // crouched, package overhead
    ctx.fillRect(0, -22, 8, 16);
    // package
    ctx.fillStyle = '#a87a4a';
    ctx.fillRect(-6, -34, 22, 16);
    ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 1;
    ctx.strokeRect(-6, -34, 22, 16);
    ctx.beginPath(); ctx.moveTo(5, -34); ctx.lineTo(5, -18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6, -26); ctx.lineTo(16, -26); ctx.stroke();
  } else if (boss.state === 'whistle') {
    // hand at mouth
    ctx.fillRect(6, -8, 8, 8);
  } else {
    // default arm at side
    ctx.fillRect(8, 0, 8, 14);
  }
  ctx.restore();

  // head
  ctx.fillStyle = '#f4d4a0';
  ctx.beginPath(); ctx.arc(0, -16, 9, 0, Math.PI*2); ctx.fill();
  // glasses
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(-4, -16, 3, 0, Math.PI*2);
  ctx.arc(4, -16, 3, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-1, -16); ctx.lineTo(1, -16); ctx.stroke();
  // glint
  ctx.fillStyle = '#fff';
  ctx.fillRect(-5, -17, 1, 1); ctx.fillRect(3, -17, 1, 1);
  // mustache / scowl
  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(-4, -12, 8, 1.5);
  // mouth — open if whistling
  if (boss.state === 'whistle') {
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(0, -10, 1.6, 0, Math.PI*2); ctx.fill();
    // whistle musical note ring
    ctx.strokeStyle = `rgba(255,255,255,${0.8 - (70-boss.stateTimer)/100})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -10, 12 + (70-boss.stateTimer)*0.4, 0, Math.PI*2); ctx.stroke();
  } else {
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(-2, -10, 4, 1);
  }

  // pith helmet (postal cap)
  ctx.fillStyle = '#1a2a55';
  ctx.beginPath();
  ctx.ellipse(0, -22, 11, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillRect(-11, -22, 22, 6);
  // brim
  ctx.fillStyle = '#0a1a35';
  ctx.fillRect(-13, -16, 26, 2);
  // postal star badge
  ctx.fillStyle = '#ffcc33';
  ctx.beginPath();
  for (let i=0;i<5;i++) {
    const a = -Math.PI/2 + i*Math.PI*2/5;
    const x = Math.cos(a)*3, y = -22 + Math.sin(a)*3;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    const a2 = a + Math.PI/5;
    ctx.lineTo(Math.cos(a2)*1.4, -22 + Math.sin(a2)*1.4);
  }
  ctx.closePath(); ctx.fill();

  ctx.restore();
  drawBossHPBar(boss.name || 'THE MAILMAN');
}

function drawBossHPBar(name) {
  // top centered HP bar
  const bw = 320, bh = 18;
  const bx = W/2 - bw/2, by = 18;
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(bx-4, by-4, bw+8, bh+8);
  ctx.fillStyle='#222';
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle='#ff2244';
  ctx.fillRect(bx+1, by+1, (bw-2) * (boss.hp/boss.maxHp), bh-2);
  ctx.fillStyle='#fff';
  ctx.font='bold 12px Trebuchet MS';
  ctx.textAlign='center';
  ctx.fillText(name, W/2, by + 13);
  ctx.textAlign='left';
}

/* ---------- Player draw ---------- */
function drawPlayer() {
  const d = player; if (!d || !d.alive) return;
  if (d.invuln > 0 && Math.floor(d.invuln/4)%2===0) return;
  const sx = d.x - cam.x, sy = d.y - cam.y;
  const c = d.char;

  if (d.invincible > 0) {
    const aura = ctx.createRadialGradient(sx+d.w/2,sy+d.h/2,4,sx+d.w/2,sy+d.h/2,40);
    aura.addColorStop(0,'rgba(255,220,80,0.5)'); aura.addColorStop(1,'rgba(255,220,80,0)');
    ctx.fillStyle=aura; ctx.fillRect(sx-30,sy-30,d.w+60,d.h+60);
  }
  if (d.speedBoost > 0) {
    ctx.fillStyle='rgba(120,255,160,0.3)';
    for (let i=1;i<=3;i++) ctx.fillRect(sx - d.facing*i*8, sy + d.h/4, d.w*0.6, d.h*0.6);
  }

  ctx.save();
  ctx.translate(sx + d.w/2, sy + d.h/2);
  ctx.scale(d.facing, 1);
  const bob = (!d.onGround) ? 0 : Math.sin(d.runFrame)*(Math.abs(d.vx)>0.5?2:0);
  ctx.translate(0, -bob);
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0,18+bob,18,4,0,0,Math.PI*2); ctx.fill();

  const main = c.color, dark = c.accent, belly = c.bellyColor, earIn = c.earInner;
  const wag = Math.sin(elapsed*0.3)*0.5;
  ctx.save(); ctx.translate(-16,-2); ctx.rotate(-0.4 + wag);
  ctx.fillStyle = main;
  ctx.beginPath(); ctx.ellipse(-6,0,8,3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.ellipse(-12,0,4,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.fillStyle = main;
  ctx.beginPath(); ctx.ellipse(-2,4,16,9,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = belly;
  ctx.beginPath(); ctx.ellipse(-2,9,12,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.ellipse(-4,0,12,5,0,0,Math.PI*2); ctx.fill();

  const lf = d.onGround && Math.abs(d.vx)>0.5 ? Math.sin(d.runFrame)*4 : 0;
  const lr = d.onGround && Math.abs(d.vx)>0.5 ? Math.sin(d.runFrame+Math.PI)*4 : 0;
  ctx.fillStyle = main;
  ctx.fillRect(-12,10,4,8+lr); ctx.fillRect(-2,11,4,8+lf);
  ctx.fillRect(8,10,4,8+lr);   ctx.fillRect(14,11,4,8+lf);
  ctx.fillStyle = dark;
  ctx.fillRect(-12,17+lr,4,2); ctx.fillRect(-2,18+lf,4,2);
  ctx.fillRect(8,17+lr,4,2);   ctx.fillRect(14,18+lf,4,2);

  ctx.fillStyle = main;
  ctx.beginPath(); ctx.ellipse(14,-4,10,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = belly;
  ctx.beginPath(); ctx.ellipse(22,-1,6,4,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.ellipse(22,-3,5,2,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(27,-2,1.6,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#000'; ctx.lineWidth=1;
  if (d.barkAnim > 6) {
    ctx.fillStyle='#220';
    ctx.beginPath(); ctx.ellipse(22,2,4,2.5,0,0,Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(24,1); ctx.lineTo(20,2); ctx.stroke();
  }
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(17,-5,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.arc(17.5,-5,1.1,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = dark;
  ctx.fillRect(15,-8,5,1.2);

  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.moveTo(8,-10); ctx.lineTo(11,-18); ctx.lineTo(14,-9); ctx.fill();
  ctx.beginPath(); ctx.moveTo(16,-10); ctx.lineTo(19,-18); ctx.lineTo(21,-9); ctx.fill();
  ctx.fillStyle = earIn;
  ctx.beginPath(); ctx.moveTo(11,-16); ctx.lineTo(12,-10); ctx.lineTo(13,-12); ctx.fill();
  ctx.beginPath(); ctx.moveTo(19,-16); ctx.lineTo(19.5,-10); ctx.lineTo(20.5,-12); ctx.fill();

  ctx.fillStyle = c.collar;
  ctx.fillRect(6,2,6,3);
  ctx.fillStyle='#ffcc33';
  ctx.beginPath(); ctx.arc(9,6,1.6,0,Math.PI*2); ctx.fill();

  ctx.restore();

  if (d.barkAnim > 0) {
    const t = 1 - d.barkAnim/18;
    ctx.strokeStyle = `rgba(255,255,200,${1-t})`;
    ctx.lineWidth = 3;
    for (let i=0;i<3;i++) {
      const r = 12 + t*40 + i*8;
      ctx.beginPath();
      ctx.arc(sx + d.w/2 + d.facing*16, sy + d.h/2 - 4, r, -0.6 + (d.facing<0?Math.PI:0), 0.6 + (d.facing<0?Math.PI:0));
      ctx.stroke();
    }
  }
}

/* ---------- Goal ---------- */
function drawGoal() {
  if (!goal) return;
  const sx = goal.x - cam.x, sy = goal.y - cam.y;
  if (level.isBoss) {
    const bossAlive = boss && boss.hp > 0;
    const grad = ctx.createRadialGradient(sx+goal.w/2,sy+goal.h/2,4,sx+goal.w/2,sy+goal.h/2,goal.w/2);
    if (bossAlive) {
      grad.addColorStop(0,'#444'); grad.addColorStop(0.6,'#222'); grad.addColorStop(1,'rgba(20,10,30,0)');
    } else {
      grad.addColorStop(0,'#ffeebb'); grad.addColorStop(0.6,'#ffaa55'); grad.addColorStop(1,'rgba(80,30,10,0)');
    }
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.ellipse(sx+goal.w/2, sy+goal.h/2, goal.w/2, goal.h/2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = bossAlive ? '#888' : '#3a1a0a';
    ctx.font='bold 12px Trebuchet MS';
    ctx.fillText(bossAlive ? 'LOCKED' : 'HOME', sx+goal.w/2-(bossAlive?20:13), sy+goal.h/2+4);
    if (bossAlive) {
      ctx.strokeStyle='#666'; ctx.lineWidth=3;
      for (let i=0;i<3;i++) {
        const ang = (elapsed*0.02 + i*Math.PI*2/3);
        ctx.beginPath();
        ctx.moveTo(sx + goal.w/2 + Math.cos(ang)*30, sy+goal.h/2 + Math.sin(ang)*30);
        ctx.lineTo(sx + goal.w/2 - Math.cos(ang)*30, sy+goal.h/2 - Math.sin(ang)*30);
        ctx.stroke();
      }
    }
    return;
  }
  ctx.fillStyle='#a05a2a';
  ctx.fillRect(sx, sy+24, goal.w, goal.h-24);
  ctx.fillStyle='#6b2a1a';
  ctx.beginPath();
  ctx.moveTo(sx-8, sy+28); ctx.lineTo(sx+goal.w/2, sy); ctx.lineTo(sx+goal.w+8, sy+28); ctx.fill();
  ctx.fillStyle='#1a0f06';
  ctx.beginPath();
  ctx.arc(sx+goal.w/2, sy+goal.h-12, 16, Math.PI, 0, false);
  ctx.lineTo(sx+goal.w/2+16, sy+goal.h);
  ctx.lineTo(sx+goal.w/2-16, sy+goal.h);
  ctx.fill();
  ctx.fillStyle='#fff8dc';
  ctx.fillRect(sx+10, sy+30, goal.w-20, 14);
  ctx.fillStyle='#000';
  ctx.font='bold 10px Trebuchet MS';
  ctx.fillText('HOME', sx+goal.w/2-14, sy+41);
}

/* ---------- Particles ---------- */
function updateParticles() {
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
  }
  for (let i = particles.length-1; i>=0; i--) if (particles[i].life<=0) particles.splice(i,1);
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life/p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - cam.x - p.size/2, p.y - cam.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

}
function drawHeart(x,y,full) {
  ctx.fillStyle = full ? '#ff3344' : '#552222';

}
function drawTimer(x,y,color,icon,frac) {

/* ---------- Title screen ---------- */
function drawTitle() {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a1f3a'); g.addColorStop(1,'#0a0510');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  for (let i=0;i<60;i++) {
    const x = (i*97)%W, y = (i*53)%H * 0.6;
    ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(elapsed*0.05+i)*0.3})`;
    ctx.fillRect(x,y,2,2);
  }
  ctx.fillStyle='#000';
  ctx.font='bold 72px Trebuchet MS';
  ctx.textAlign='center';
  ctx.fillText('SHADOW SHEPHERDS', W/2 + 4, 160 + 4);
  ctx.fillStyle='#ffe6a0';
  ctx.fillText('SHADOW SHEPHERDS', W/2 - 2, 158);

  ctx.font='18px Trebuchet MS';
  ctx.fillStyle='#fff';
  ctx.fillText('Two loyal German Shepherds. Ten zones of peril.', W/2, 200);
  ctx.font='13px Trebuchet MS';
  ctx.fillStyle='#aaa';
  ctx.fillText(`Backyard → House → Neighborhood → ... → The Lair    (zones 1-2 playable)`, W/2, 222);

  drawTitleDog(W/2 - 130, 320, CHARACTERS.keeley, Math.sin(elapsed*0.05));
  drawTitleDog(W/2 + 130, 320, CHARACTERS.sniper, Math.sin(elapsed*0.05 + Math.PI));

  const save = loadProgress();
  if (save) {
    const sLvl = Math.min(save.levelIdx, LEVELS.length-1);
    const sZone = LEVELS[sLvl].zone + 1;
    const sChar = save.characterId === 'sniper' ? 'SNIPER' : 'KEELEY';
    ctx.font='bold 20px Trebuchet MS';
    ctx.fillStyle = Math.floor(elapsed/30)%2===0 ? '#88ff99' : '#66cc77';
    ctx.fillText('[C] CONTINUE', W/2 - 140, 450);
    ctx.fillStyle = '#ffcc66';
    ctx.fillText('[N] NEW GAME', W/2 + 140, 450);
    ctx.font='12px Trebuchet MS';
    ctx.fillStyle='#aaa';
    ctx.fillText(`${sChar} • Zone ${sZone}/${TOTAL_PLANNED_ZONES} • L${sLvl+1} • ${save.lives}♥ • 🦴${save.totalBones}`, W/2 - 140, 470);
    ctx.fillText('Wipes save', W/2 + 140, 470);
  } else {
    ctx.font='bold 22px Trebuchet MS';
    ctx.fillStyle = Math.floor(elapsed/30)%2===0 ? '#ffcc66' : '#ffaa33';
    ctx.fillText('PRESS [SPACE] OR [ENTER] TO START', W/2, 460);
  }
  ctx.font='14px Trebuchet MS';
  ctx.fillStyle='#aaa';
  ctx.fillText('Move: A/D or ← →    Jump: W/Space/↑    Bark: X', W/2, 495);
  ctx.textAlign='left';

  if (save && consumeJust('c')) {
    playBlip(700,0.08);
    continueFromSave();
    return;
  }
  if (consumeJust('n') || consumeJust(' ') || consumeJust('enter')) {
    if (save) clearProgress();
    state = 'charSelect';
  }
}

/* ---------- Character select ---------- */
function drawCharSelect() {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a1f3a'); g.addColorStop(1,'#0a0510');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ffcc66';
  ctx.font='bold 36px Trebuchet MS';
  ctx.fillText('CHOOSE YOUR SHEPHERD', W/2, 80);
  ctx.font='14px Trebuchet MS';
  ctx.fillStyle='#aaa';
  ctx.fillText('← / →  to choose    [SPACE] / [ENTER] to confirm', W/2, 110);

  const charsList = ['keeley', 'sniper'];
  for (let i=0;i<2;i++) {
    const c = CHARACTERS[charsList[i]];
    const cx = W/2 + (i===0 ? -200 : 200);
    const cy = 280;
    const selected = i === selectedCharIdx;
    ctx.fillStyle = selected ? 'rgba(255,200,100,0.18)' : 'rgba(0,0,0,0.4)';
    ctx.strokeStyle = selected ? '#ffcc66' : '#444';
    ctx.lineWidth = selected ? 4 : 2;
    ctx.fillRect(cx-130, cy-150, 260, 320);
    ctx.strokeRect(cx-130, cy-150, 260, 320);

    drawTitleDog(cx, cy, c, selected ? Math.sin(elapsed*0.1) : 0);

    ctx.font='bold 24px Trebuchet MS';
    ctx.fillStyle = c.id==='keeley' ? '#ffcc66' : '#aabbff';
    ctx.fillText(c.name, cx, cy+115);
    ctx.font='13px Trebuchet MS';
    ctx.fillStyle='#fff';
    ctx.fillText(c.description, cx, cy+135);

    ctx.font='12px Trebuchet MS'; ctx.textAlign='left';
    const baseX = cx-90, baseY = cy+155;
    drawStatBar(baseX, baseY, 'SPEED', c.runSpeed/7, '#88ff99');
    drawStatBar(baseX, baseY+18, 'JUMP', c.jumpPower/15, '#aaeeff');
    drawStatBar(baseX, baseY+36, 'HP', c.maxHP/5, '#ff7788');
    drawStatBar(baseX, baseY+54, 'BARK', c.barkRange/150, '#ffcc66');
    ctx.textAlign='center';

    if (selected) {
      ctx.font='12px Trebuchet MS'; ctx.fillStyle='#fff';
      ctx.fillText(c.tagline, cx, cy+260);
    }
  }
  ctx.textAlign='left';

  if (consumeJust('arrowleft') || consumeJust('a') ||
      consumeJust('arrowright') || consumeJust('d')) {
    selectedCharIdx = (selectedCharIdx + 1) % 2;
    playBlip(500,0.04);
  }
  if (consumeJust(' ') || consumeJust('enter')) {
    playBlip(700,0.08);
    lives = 3; totalBones = 0;
    startLevel(0);
  }
}
function drawStatBar(x,y,label,frac,color) {
  ctx.fillStyle='#fff'; ctx.fillText(label,x,y+9);
  ctx.fillStyle='#222'; ctx.fillRect(x+50,y, 110, 10);
  ctx.fillStyle=color; ctx.fillRect(x+50,y, 110*Math.min(1,frac), 10);
}

  if (Math.random() < 0.5) {
    const colors=['#ffcc66','#ff5566','#88ff99','#aaeeff','#ffffff'];
    spawnParticle(Math.random()*W + cam.x, cam.y - 10,
      colors[Math.floor(Math.random()*colors.length)],
      (Math.random()-0.5)*2, 2+Math.random()*2, 80, 4);
  }

  ctx.textAlign='center';

  // VICTORY! headline at top
  ctx.fillStyle='#000';
  ctx.font='bold 56px Trebuchet MS';
  ctx.fillText('VICTORY!', W/2 + 3, 102);
  ctx.fillStyle='#fff';
  ctx.fillText('VICTORY!', W/2, 100);

  // === Character portrait reveal ===
  const c = player.char;
  const portraitY = 230;
  const aColor = c.id === 'keeley' ? '255,180,80' : '120,160,255';

  // pulsating aura
  const auraR = 95 + Math.sin(elapsed*0.06)*10;
  const aura = ctx.createRadialGradient(W/2, portraitY, 10, W/2, portraitY, auraR);
  aura.addColorStop(0,    `rgba(${aColor},0.55)`);
  aura.addColorStop(0.55, `rgba(${aColor},0.25)`);
  aura.addColorStop(1,    `rgba(${aColor},0)`);
  ctx.fillStyle = aura;
  ctx.fillRect(W/2 - auraR - 10, portraitY - auraR, auraR*2 + 20, auraR*2);

  // orbiting sparkles
  for (let i = 0; i < 8; i++) {
    const ang = elapsed*0.04 + i*(Math.PI*2/8);
    const r = 88 + Math.sin(elapsed*0.08 + i)*6;
    const sx = W/2 + Math.cos(ang) * r;
    const sy = portraitY + Math.sin(ang) * r * 0.55;
    const a = 0.5 + Math.sin(elapsed*0.1 + i*0.7)*0.4;
    ctx.fillStyle = `rgba(255,250,200,${a})`;
    ctx.fillRect(sx-1.5, sy-1.5, 3, 3);
    // tiny + sparkle every other one
    if (i % 2 === 0) {
      ctx.fillRect(sx-3, sy, 6, 1);
      ctx.fillRect(sx, sy-3, 1, 6);
    }
  }

  // The winning dog, bobbing happily in their victory pose
  drawTitleDog(W/2, portraitY, c, Math.sin(elapsed*0.12) * 2);
  // (drawTitleDog draws the dog's name at y = portraitY + 90 = 320 in their accent color)

  // Tagline below the auto-drawn name
  ctx.font='bold 22px Trebuchet MS';
  ctx.fillStyle = c.id === 'keeley' ? '#ffcc66' : '#aabbff';
  ctx.fillText('BANISHED THE SHADOW', W/2, 360);

  ctx.font='14px Trebuchet MS';
  ctx.fillStyle='#ffaaaa';
  ctx.fillText('All ten zones cleared. The pack is safe.', W/2, 385);

  // Stats
  ctx.font='16px Trebuchet MS';
  ctx.fillStyle='#fff';
  ctx.fillText(`Bones collected: ${totalBones}    Lives left: ${lives}`, W/2, 415);

  // Prompt
  ctx.font='14px Trebuchet MS';
  ctx.fillStyle = Math.floor(elapsed/30)%2===0 ? '#aaa' : '#ddd';
  ctx.fillText('PRESS [SPACE] TO PLAY AGAIN', W/2, 460);

  ctx.textAlign='left';

  if (consumeJust(' ') || consumeJust('enter')) {
    state = 'charSelect';
    lives = 3; totalBones = 0;
    clearProgress();
  }
}

/* ---------- Audio ---------- */
let audioCtx;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
}
function playBlip(freq, dur) {
  ensureAudio(); if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type='square'; o.frequency.value = freq;
  g.gain.value = 0.05;
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function playBark() {
  ensureAudio(); if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  for (let i=0;i<2;i++) {
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(220,t0+i*0.08);
    o.frequency.exponentialRampToValueAtTime(120,t0+i*0.08+0.07);
    g.gain.value=0.08; g.gain.exponentialRampToValueAtTime(0.0001,t0+i*0.08+0.08);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0+i*0.08); o.stop(t0+i*0.08+0.09);
  }
}

/* ---------- World draw ---------- */
function drawWorld() {
  drawBG();
  drawPlatforms();
  drawHazards();
  drawBones();
  enemies.forEach(drawEnemy);
  drawProjectiles();
  drawBoss();
  drawGoal();
  drawPlayer();
  drawParticles();
  drawHUD();
  if (flashTimer > 0) {
    ctx.fillStyle = `rgba(255,80,80,${flashTimer/30 * 0.4})`;
    ctx.fillRect(0,0,W,H);
    flashTimer--;
  }
}

/* ---------- Polyfill ---------- */
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if (typeof r === 'number') r = [r,r,r,r];
    this.beginPath();
    this.moveTo(x+r[0], y);
    this.lineTo(x+w-r[1], y);
    this.quadraticCurveTo(x+w, y, x+w, y+r[1]);
    this.lineTo(x+w, y+h-r[2]);
    this.quadraticCurveTo(x+w, y+h, x+w-r[2], y+h);
    this.lineTo(x+r[3], y+h);
    this.quadraticCurveTo(x, y+h, x, y+h-r[3]);
    this.lineTo(x, y+r[0]);
    this.quadraticCurveTo(x, y, x+r[0], y);
    this.closePath();
    return this;
  };
}

/* ---------- Main loop ---------- */
function loop() {
  elapsed++;
  if (state === 'title') drawTitle();
  else if (state === 'charSelect') drawCharSelect();
  else if (state === 'zoneIntro') drawZoneIntro();
  else if (state === 'intro') drawIntro();
  else if (state === 'play') {
    updatePlayer();
    enemies.forEach(updateEnemy);
    updateProjectiles();
    if (boss) updateBoss();
    updateParticles();
    updateCam();
    drawWorld();
  }
  else if (state === 'levelComplete') drawLevelComplete();
  else if (state === 'zoneCleared') drawZoneCleared();
  else if (state === 'gameOver') drawGameOver();
  else if (state === 'victory') drawVictory();

  for (const k in justPressed) justPressed[k] = false;
  requestAnimationFrame(loop);
}

loadLevel(0);
loop();

/* ============================================================
   MOBILE / TOUCH / PWA SUPPORT
   ============================================================ */

// Treat as touch-primary only when the user's MAIN pointer is coarse (i.e. phones/tablets).
// Touchscreen laptops still use mouse+keyboard and shouldn't get touch UI or rotate prompts.
const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');

// Wire touch buttons into the keys[]/justPressed[] state
function bindTouchButton(btn) {
  const key = btn.dataset.key;
  const press = e => {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!keys[key]) justPressed[key] = true;
    keys[key] = true;
    btn.classList.add('pressed');
    // Audio unlock on first touch
    ensureAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  };
  const release = e => {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    keys[key] = false;
    btn.classList.remove('pressed');
  };
  btn.addEventListener('touchstart', press, { passive: false });
  btn.addEventListener('touchend',   release);
  btn.addEventListener('touchcancel', release);
  btn.addEventListener('mousedown',  press);
  btn.addEventListener('mouseup',    release);
  btn.addEventListener('mouseleave', release);
}
document.querySelectorAll('.touch-btn').forEach(bindTouchButton);

// Tap anywhere on canvas/title screens to also start (so iOS users without keyboard can begin)
canvas.addEventListener('touchstart', e => {
  // On title/charSelect/end screens, simulate a SPACE press to advance
  if (state === 'title' || state === 'charSelect' || state === 'levelComplete' ||
      state === 'zoneCleared' || state === 'gameOver' || state === 'victory') {
    if (!keys[' ']) justPressed[' '] = true;
    keys[' '] = true;
    setTimeout(() => { keys[' '] = false; }, 50);
  }
  ensureAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { passive: true });

// Tap on left/right side of canvas during character select to switch
canvas.addEventListener('touchstart', e => {
  if (state !== 'charSelect') return;
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const localX = t.clientX - rect.left;
  if (localX < rect.width * 0.4) {
    selectedCharIdx = 0; // left side → Keeley
  } else if (localX > rect.width * 0.6) {
    selectedCharIdx = 1; // right side → Sniper
  }
}, { passive: true });

// Prevent pinch-zoom and double-tap zoom
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

// Audio unlock on any first interaction (iOS requires user gesture)
const unlockAudio = () => {
  ensureAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
};
document.addEventListener('touchstart', unlockAudio, { once: true });
document.addEventListener('mousedown',  unlockAudio, { once: true });
document.addEventListener('keydown',    unlockAudio, { once: true });

// Orientation detection — only meaningful on phone/tablet-class devices
function updateOrientation() {
  if (!isTouch) { document.body.classList.remove('portrait'); return; }
  const isPortrait = window.innerHeight > window.innerWidth;
  document.body.classList.toggle('portrait', isPortrait);
}
window.addEventListener('resize', updateOrientation);
window.addEventListener('orientationchange', updateOrientation);
updateOrientation();

// Register service worker for offline play (only works when hosted, no-op on file://)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
