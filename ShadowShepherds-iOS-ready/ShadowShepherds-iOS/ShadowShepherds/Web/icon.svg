<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- starry night background -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1f3a"/>
      <stop offset="100%" stop-color="#05060d"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" rx="80"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.7">
    <rect x="60" y="80" width="3" height="3"/>
    <rect x="120" y="40" width="2" height="2"/>
    <rect x="200" y="70" width="3" height="3"/>
    <rect x="320" y="50" width="2" height="2"/>
    <rect x="420" y="90" width="3" height="3"/>
    <rect x="450" y="160" width="2" height="2"/>
    <rect x="50" y="200" width="2" height="2"/>
    <rect x="80" y="380" width="2" height="2"/>
    <rect x="440" y="320" width="3" height="3"/>
  </g>

  <!-- title arc -->
  <text x="256" y="80" text-anchor="middle" font-family="Trebuchet MS, sans-serif"
        font-weight="bold" font-size="34" fill="#ffcc66"
        style="text-shadow: 2px 2px 0 #000;">SHADOW</text>
  <text x="256" y="118" text-anchor="middle" font-family="Trebuchet MS, sans-serif"
        font-weight="bold" font-size="34" fill="#ffcc66">SHEPHERDS</text>

  <!-- The dog (Keeley) - centered & big -->
  <g transform="translate(256, 320) scale(4.5)">
    <!-- shadow -->
    <ellipse cx="0" cy="22" rx="22" ry="4" fill="#000" opacity="0.3"/>

    <!-- tail -->
    <ellipse cx="-22" cy="-2" rx="8" ry="3" transform="rotate(-22 -22 -2)" fill="#d4a05a"/>
    <ellipse cx="-28" cy="-6" rx="4" ry="2.5" transform="rotate(-22 -28 -6)" fill="#2a1a0a"/>

    <!-- body -->
    <ellipse cx="-2" cy="4" rx="16" ry="9" fill="#d4a05a"/>
    <!-- belly -->
    <ellipse cx="-2" cy="9" rx="12" ry="5" fill="#f5e6c0"/>
    <!-- saddle -->
    <ellipse cx="-4" cy="0" rx="12" ry="5" fill="#2a1a0a"/>

    <!-- legs -->
    <rect x="-12" y="10" width="4" height="8" fill="#d4a05a"/>
    <rect x="-2" y="11" width="4" height="8" fill="#d4a05a"/>
    <rect x="8" y="10" width="4" height="8" fill="#d4a05a"/>
    <rect x="14" y="11" width="4" height="8" fill="#d4a05a"/>
    <!-- paws -->
    <rect x="-12" y="17" width="4" height="2" fill="#2a1a0a"/>
    <rect x="-2" y="18" width="4" height="2" fill="#2a1a0a"/>
    <rect x="8" y="17" width="4" height="2" fill="#2a1a0a"/>
    <rect x="14" y="18" width="4" height="2" fill="#2a1a0a"/>

    <!-- head -->
    <ellipse cx="14" cy="-4" rx="10" ry="8" fill="#d4a05a"/>
    <!-- snout -->
    <ellipse cx="22" cy="-1" rx="6" ry="4" fill="#f5e6c0"/>
    <ellipse cx="22" cy="-3" rx="5" ry="2" fill="#2a1a0a"/>
    <!-- nose -->
    <circle cx="27" cy="-2" r="1.6" fill="#000"/>
    <!-- eye -->
    <circle cx="17" cy="-5" r="2" fill="#fff"/>
    <circle cx="17.5" cy="-5" r="1.1" fill="#000"/>

    <!-- ears -->
    <polygon points="8,-10 11,-18 14,-9" fill="#2a1a0a"/>
    <polygon points="16,-10 19,-18 21,-9" fill="#2a1a0a"/>
    <!-- ear inner -->
    <polygon points="11,-16 12,-10 13,-12" fill="#e8b18a"/>
    <polygon points="19,-16 19.5,-10 20.5,-12" fill="#e8b18a"/>

    <!-- collar -->
    <rect x="6" y="2" width="6" height="3" fill="#cc2233"/>
    <circle cx="9" cy="6" r="1.6" fill="#ffcc33"/>
  </g>

  <!-- soft golden glow around the dog -->
  <circle cx="256" cy="320" r="120" fill="none" stroke="#ffcc66" stroke-width="2" opacity="0.25"/>
</svg>
